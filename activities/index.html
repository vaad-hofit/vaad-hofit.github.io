<style>
/* Layout: the year as a shoreline running down the page. Months sit on a vertical line, each event hangs off it; the next event opens the page. */
:root{
  color-scheme:light;
  --leaf:#CDE8C2;      /* autumn */
  --dusk:#D5CBF2;      /* winter */
  --shell:#F8CBC4;     /* spring */
  --sun:#FBE7A1;       /* summer */
  --deep:#24405A;      /* text and actions */
  --ground:#FBF8F2;    /* page */

  --surface:#FFFFFF;
  --ink:var(--deep);
  --muted:#5B7083;
  --line:#E6E0D3;
  --focus:#3C7FB5;
  --vaad:#B3261E;
  --btn-bg:var(--deep);
  --btn-ink:#FFFFFF;
  --wave1:#BFEADF; --wave2:#D5CBF2; --wave3:#F8CBC4;

  --t-autumn:var(--leaf);  --s-autumn:#5A9A4B;
  --t-winter:var(--dusk);  --s-winter:#8673CC;
  --t-spring:var(--shell); --s-spring:#D9776B;
  --t-summer:var(--sun);   --s-summer:#C99A12;
  --t-none:#E9E6DF;        --s-none:#8C95A0;

  --f-display:"Fredoka","Assistant","Arial Hebrew",Arial,sans-serif;
  --f-body:"Assistant","Arial Hebrew",Arial,sans-serif;
  --fs-xs:.8125rem; --fs-s:.9rem; --fs-m:1rem; --fs-l:1.3rem; --fs-xl:1.75rem; --fs-xxl:clamp(1.8rem,4.5vw,2.8rem);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --ground:#122029; --surface:#1A2C38; --ink:#E9EFF2; --muted:#9DB1BF; --line:#2C4252;
    --focus:#8FC3EA; --vaad:#FF948C; --btn-bg:#BFEADF; --btn-ink:#122029;
    --wave1:#1F3D39; --wave2:#2E2B48; --wave3:#3F2D33;
    --t-autumn:#24392A; --s-autumn:#9BD68B;
    --t-winter:#2F2C49; --s-winter:#B6A8F0;
    --t-spring:#412D31; --s-spring:#F4A69C;
    --t-summer:#3A3420; --s-summer:#F0CF5E;
    --t-none:#26333D;   --s-none:#9DB1BF;
  }
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-m);line-height:1.55}
h1,h2,h3{font-family:var(--f-display);font-weight:500;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.wrap{max-width:980px;margin-inline:auto;padding-inline:20px}

/* masthead */
.masthead{position:relative;overflow:hidden;padding-block:30px 66px}
.masthead .wrap{position:relative;z-index:1;display:grid;gap:10px}
.brand{display:flex;gap:14px;align-items:center}
.brand img{width:72px;height:72px;flex:none;background:#FFFFFF;border-radius:50%}
.brand h1{font-size:var(--fs-xl);font-weight:600}
.masthead .lead{color:var(--muted);max-width:56ch}
.waves{position:absolute;inset-inline:0;bottom:0;height:70px;pointer-events:none}
.waves svg{position:absolute;bottom:0;width:200%;height:100%;inset-inline-start:0}
.waves .w1{fill:var(--wave1);animation:drift 22s linear infinite}
.waves .w2{fill:var(--wave2);opacity:.8;animation:drift 30s linear infinite reverse;bottom:-10px}
.waves .w3{fill:var(--wave3);opacity:.7;animation:drift 38s linear infinite;bottom:-22px}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(50%)}}

/* next up */
.next{margin-top:18px;border-radius:26px;background:var(--tint);padding:clamp(18px,3vw,30px);display:grid;grid-template-columns:auto 1fr;gap:18px 26px;align-items:center}
.next .count{display:grid;justify-items:center;background:var(--surface);border-radius:20px;padding:12px 18px;min-width:110px;text-align:center}
.next .count b{font-family:var(--f-display);font-size:2.4rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:var(--s)}
.next .count span{font-size:var(--fs-s);color:var(--muted)}
.kicker{font-family:var(--f-display);font-size:var(--fs-s);color:var(--muted)}
.next h2{font-size:var(--fs-xxl);font-weight:600;margin-block:2px 4px}
.next .when{color:var(--muted);font-size:var(--fs-s)}
.next .desc{margin-top:8px;max-width:58ch}
.next .links{margin-top:12px}

/* month jump strip */
.strip{position:sticky;top:0;z-index:5;background:var(--ground);border-bottom:1px solid var(--line);margin-top:24px}
.strip .wrap{display:flex;gap:2px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
.strip a{flex:0 0 auto;display:grid;justify-items:center;gap:1px;min-width:54px;padding:4px 8px;border-radius:12px;text-decoration:none;font-family:var(--f-display);font-size:var(--fs-xs)}
.strip a:hover{background:var(--surface)}
.strip a.off{opacity:.4;pointer-events:none}
.strip .dots{display:flex;gap:3px;height:7px}
.strip .dots i{width:6px;height:6px;border-radius:50%;background:var(--s)}

/* timeline */
main{padding-block:24px 70px}
.timeline{position:relative;display:grid;gap:30px}
.timeline::before{content:"";position:absolute;inset-block:6px 0;inset-inline-start:calc(8.5rem + 9px);width:2px;background:linear-gradient(var(--s-autumn),var(--s-winter),var(--s-spring),var(--s-summer));opacity:.45;border-radius:2px}
.month{display:grid;grid-template-columns:8.5rem 1fr;gap:0 30px;scroll-margin-top:70px}
.month-name{position:relative;padding-top:2px}
.month-name h2{font-size:var(--fs-l)}
.month-name small{display:block;color:var(--muted);font-size:var(--fs-s)}
.month-name::after{content:"";position:absolute;inset-inline-end:-27px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--s);box-shadow:0 0 0 4px var(--ground)}
.events{display:grid;gap:12px}

.event{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.date{display:grid;justify-items:center;align-content:center;width:62px;min-height:62px;border-radius:16px;background:var(--tint);text-align:center;padding:6px 4px}
.date b{font-family:var(--f-display);font-size:1.6rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.date span{font-size:var(--fs-xs);color:var(--muted);line-height:1.2}
.date.vague b{font-size:var(--fs-s);font-weight:500}
.event h3{font-size:1.15rem}
.event .meta{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}
.event .desc{margin-top:6px;font-size:var(--fs-s);max-width:62ch}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:10px;font-size:var(--fs-s)}
.cal{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-family:var(--f-display);font-weight:500;background:var(--btn-bg);color:var(--btn-ink);border-radius:999px;padding:5px 14px;font-size:var(--fs-s)}
.cal:hover{filter:brightness(1.12)}
.cal svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.help{color:var(--vaad);text-decoration:underline;text-underline-offset:3px}
.event.is-next{box-shadow:0 0 0 3px var(--s)}
.event.is-past{opacity:.55}
.event.is-past .date{filter:saturate(.3)}
.tag{display:inline-block;font-size:var(--fs-xs);font-family:var(--f-display);border-radius:999px;padding:0 10px;background:var(--tint);margin-inline-start:6px;vertical-align:middle}

.today{display:flex;gap:10px;align-items:center;font-family:var(--f-display);font-size:var(--fs-s);color:var(--s-spring);margin-block:-8px}
.today::before,.today::after{content:"";flex:1;height:2px;background:currentColor;opacity:.5;border-radius:2px}

.foot{border-top:1px solid var(--line);padding-block:22px 34px;color:var(--muted);font-size:var(--fs-s);display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
.foot a{color:var(--focus)}
.state{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:28px;text-align:center;color:var(--muted)}

@media (max-width:640px){
  .timeline::before{inset-inline-start:7px}
  .month{grid-template-columns:1fr;gap:10px;padding-inline-start:28px}
  .month-name::after{inset-inline-end:auto;inset-inline-start:-27px}
  .next{grid-template-columns:1fr}
  .next .count{justify-self:start;display:flex;gap:8px;align-items:baseline;min-width:0;padding:8px 14px}
  .next .count b{font-size:1.8rem}
}
@media (prefers-reduced-motion:reduce){
  .waves svg{animation:none}
  html{scroll-behavior:auto}
}
</style>
</head>

    <svg class="w1" viewBox="0 0 1200 70" preserveAspectRatio="none"><path d="M0 50 Q60 36 120 50 T240 50 T360 50 T480 50 T600 50 T720 50 T840 50 T960 50 T1080 50 T1200 50 V70 H0Z"/></svg>
  </div>
</header>

<div class="wrap"><section class="next" id="next" style="--tint:var(--t-none);--s:var(--s-none)" aria-live="polite">
  <div><p class="kicker">הפעילות הקרובה</p><h2>טוענים את הפעילויות…</h2></div>
</section></div>

<nav class="strip" aria-label="קפיצה לחודש"><div class="wrap" id="strip"></div></nav>

<main class="wrap"><div class="timeline" id="timeline"></div></main>

<footer class="wrap foot">
  <span>הפעילויות מתעדכנות אוטומטית מהוועד.</span>
  <a href="https://vaad-hofit.github.io/">רוצים לעזור לארגן? ללוח ההתנדבות</a>
</footer>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v4M10 15h4"/></symbol>
</svg>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbw9pvqZgWZTMnVdV9lOA10x2droDaesk_6eGSHZ3AryzM7YQ3k3unXxefrBV7cRAYj6/exec';
const VOLUNTEER_URL = 'https://vaad-hofit.github.io/';
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DAY = 864e5;

const SEASON = m => !m ? 'none' : [9,10,11].includes(m) ? 'autumn' : [12,1,2].includes(m) ? 'winter' : [3,4,5].includes(m) ? 'spring' : 'summer';
const vars = ev => `--tint:var(--t-${SEASON(ev.month)});--s:var(--s-${SEASON(ev.month)})`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoToDate = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
const compact = iso => iso.replace(/-/g, '');

let lastJson = '';

function daysUntil(ev, today){
  if (!ev.exact) return null;
  return Math.round((isoToDate(ev.exact) - isoToDate(today)) / DAY);
}

function whenText(ev){
  if (ev.exact){ const d = isoToDate(ev.exact); return `יום ${DAYS[d.getDay()]}, ${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`; }
  if (ev.month) return `${ev.whenText} ${ev.year}, התאריך המדויק ייקבע`;
  return 'התאריך ייקבע';
}

function calLink(ev){
  if (!ev.exact) return '';
  const end = new Date(isoToDate(ev.exact).getTime() + DAY);
  const endIso = `${end.getFullYear()}${String(end.getMonth()+1).padStart(2,'0')}${String(end.getDate()).padStart(2,'0')}`;
  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(ev.title + ' - חופית')
    + '&dates=' + compact(ev.exact) + '/' + endIso
    + '&details=' + encodeURIComponent((ev.desc || '') + '\n\nלוח הפעילויות: https://vaad-hofit.github.io/activities/');
  return `<a class="cal" href="${url}" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#cal"/></svg>הוספה ליומן</a>`;
}

function freeSpots(ev, signups){
  if (!ev.needed || ev.isPast || ev.isLocked) return 0;
  return Math.max(0, ev.needed - signups.filter(s => s.eventId === ev.id).length);
}

function helpLink(ev, signups){
  return freeSpots(ev, signups) ? `<a class="help" href="${VOLUNTEER_URL}">מחפשים מתנדבים לפעילות הזו</a>` : '';
}

function dateBadge(ev){
  if (ev.exact){
    const d = isoToDate(ev.exact);
    return `<div class="date" aria-hidden="true"><b>${d.getDate()}</b><span>יום ${DAYS[d.getDay()]}</span></div>`;
  }
  return `<div class="date vague" aria-hidden="true"><b>${ev.month ? 'במהלך' : 'ייקבע'}</b><span>${ev.month ? 'החודש' : ''}</span></div>`;
}

function eventHtml(ev, data, nextId){
  const cls = ev.isPast ? 'is-past' : ev.id === nextId ? 'is-next' : '';
  const tag = ev.isPast ? '<span class="tag">התקיים</span>' : ev.id === nextId ? '<span class="tag">הבא בתור</span>' : '';
  const links = ev.isPast ? '' : [calLink(ev), helpLink(ev, data.signups)].join('');
  return `<article class="event ${cls}" style="${vars(ev)}">
    ${dateBadge(ev)}
    <div>
      <h3>${esc(ev.title)}${tag}</h3>
      <p class="meta">${esc(whenText(ev))}</p>
      ${ev.desc ? `<p class="desc">${esc(ev.desc)}</p>` : ''}
      ${links.trim() ? `<div class="links">${links}</div>` : ''}
    </div>
  </article>`;
}

function render(data){
  const events = data.events.slice().sort((a,b) => a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0);
  const next = events.find(e => !e.isPast);

  // next up
  const box = document.getElementById('next');
  if (!next){
    box.setAttribute('style', '--tint:var(--t-none);--s:var(--s-none)');
    box.innerHTML = `<div><p class="kicker">הפעילות הקרובה</p><h2>אין כרגע פעילויות מתוכננות</h2><p class="desc">הוועד יעדכן כאן כשתיקבע הפעילות הבאה.</p></div>`;
  } else {
    const n = daysUntil(next, data.today);
    const count = n === null
      ? `<div class="count"><b>${esc(MONTHS[next.month-1] || '')}</b><span>${next.year || ''}</span></div>`
      : `<div class="count"><b>${n === 0 ? 'היום' : n}</b><span>${n === 0 ? '' : n === 1 ? 'מחר' : 'ימים'}</span></div>`;
    box.setAttribute('style', vars(next));
    box.innerHTML = `${count}<div>
      <p class="kicker">הפעילות הקרובה</p>
      <h2>${esc(next.title)}</h2>
      <p class="when">${esc(whenText(next))}</p>
      ${next.desc ? `<p class="desc">${esc(next.desc)}</p>` : ''}
      <div class="links">${calLink(next)}${helpLink(next, data.signups)}</div>
    </div>`;
  }

  // group by year+month, in order; undated at the end
  const groups = [];
  events.forEach(ev => {
    const key = ev.month ? `${ev.year}-${ev.month}` : 'none';
    let g = groups.find(x => x.key === key);
    if (!g){ g = {key, month:ev.month, year:ev.year, items:[]}; groups.push(g); }
    g.items.push(ev);
  });

  const todayKey = data.today.slice(0, 7);
  let todayShown = false;
  const html = groups.map(g => {
    const gKey = g.month ? `${g.year}-${String(g.month).padStart(2,'0')}` : '9999-12';
    let marker = '';
    if (!todayShown && gKey >= todayKey && g.items.some(e => !e.isPast)){
      todayShown = true;
      marker = `<p class="today" aria-hidden="true">היום</p>`;
    }
    const name = g.month ? MONTHS[g.month-1] : 'התאריך ייקבע';
    return `${marker}<section class="month" id="m-${g.key}" style="--s:var(--s-${SEASON(g.month)})">
      <div class="month-name"><h2>${name}</h2>${g.year ? `<small>${g.year}</small>` : ''}</div>
      <div class="events">${g.items.map(ev => eventHtml(ev, data, next && next.id)).join('')}</div>
    </section>`;
  }).join('');
  document.getElementById('timeline').innerHTML = html || `<p class="state">עוד אין פעילויות בלוח.</p>`;

  // A month that appears twice (October this year and next) gets its year.
  const dated = groups.filter(g => g.month);
  document.getElementById('strip').innerHTML = dated.map((g, i) => {
    const repeat = dated.findIndex(x => x.month === g.month) !== i;
    const label = MONTHS[g.month-1] + (repeat ? ` ${String(g.year).slice(2)}'` : '');
    return `<a href="#m-${g.key}" style="--s:var(--s-${SEASON(g.month)})"><span>${label}</span><span class="dots">${g.items.map(() => '<i></i>').join('')}</span></a>`;
  }).join('');
}

function load(){
  if (document.visibilityState !== 'visible') return;
  fetch(API_URL + '?action=getData&t=' + Date.now(), {credentials:'omit'})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(show)
    .catch(() => {
      if (lastJson) return; // keep showing what we have
      document.getElementById('timeline').innerHTML = `<p class="state">לא הצלחנו לטעון את הפעילויות. בדקו את החיבור לאינטרנט ורעננו את הדף.</p>`;
    });
}

function show(data){
  const json = JSON.stringify(data);
  if (json === lastJson) return;
  lastJson = json;
  render(data);
  try { localStorage.setItem(CACHE_KEY, json); } catch (e) { /* private mode: fine */ }
}

// Shared with the volunteer board (same site): the last data either page saw, shown at once while the server wakes up.
const CACHE_KEY = 'hofit-board-data';
try { const saved = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (saved) show(saved); } catch (e) { /* no saved copy */ }
load();
setInterval(load, 60000);
document.addEventListener('visibilitychange', load);
</script>
</body>
</html>
